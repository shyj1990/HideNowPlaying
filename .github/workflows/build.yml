name: 编译插件

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Theos (roothide 版 + Apple 官方编译器)
        run: |
          brew install ldid make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          # --recursive 拉齐全部 git 子模块: vendor/include(vendor 头文件)、vendor/lib(链接库)、vendor/logos、vendor/dm.pl(打包脚本)
          git clone --depth 1 --recursive --shallow-submodules https://github.com/roothide/theos.git $HOME/theos
          # SDK 预先放置,绕开 install-theos 对 api.github.com 的请求(常被限流)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/sdks_tmp
          cd $HOME/sdks_tmp && git sparse-checkout set iPhoneOS14.5.sdk
          rm -rf $HOME/theos/sdks
          mv $HOME/sdks_tmp $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 编译
        run: make package FINALPACKAGE=1

      - name: 上传安装包(.deb)
        uses: actions/upload-artifact@v4
        with:
          name: HideNowPlaying
          path: packages/*.deb
